<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyras</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Top Action Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px;
      z-index: 10;
    }
    .icon-btn {
      background: none;
      border: none;
      color: #a0a0a0;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .icon-btn:active {
      background: #1a1a1a;
      color: #fff;
    }

    /* Center Fluid Orb */
    .center-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      position: relative;
    }
    .orb-canvas-container {
      position: relative;
      width: 270px;
      height: 270px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 270px;
      height: 270px;
      border-radius: 50%;
      filter: drop-shadow(0 0 45px rgba(115, 165, 255, 0.4));
      transition: transform 0.3s ease;
    }

    .status-text {
      margin-top: 30px;
      color: #777777;
      font-size: 15px;
      letter-spacing: 0.3px;
      text-align: center;
      padding: 0 20px;
      min-height: 22px;
    }

    /* Bottom Input Bar */
    .bottom-bar {
      display: flex;
      align-items: center;
      padding: 16px 18px 24px;
      gap: 12px;
      background: #000;
      z-index: 10;
    }
    .input-box {
      flex: 1;
      display: flex;
      align-items: center;
      background-color: #141414;
      border-radius: 35px;
      padding: 10px 18px;
      border: 1px solid #222222;
    }
    .plus-icon {
      color: #888888;
      font-size: 20px;
      font-weight: 300;
      margin-right: 10px;
      cursor: pointer;
    }
    .input-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 16px;
      width: 100%;
    }
    .input-box input::placeholder {
      color: #555555;
    }
    .action-circle-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #141414;
      border: 1px solid #222222;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s;
    }
    .action-circle-btn:active {
      transform: scale(0.92);
    }
    .action-circle-btn.mic-active {
      background: #202b3d;
      border-color: #4b80e3;
      color: #4b80e3;
    }
    .action-circle-btn.close {
      background: #ffffff;
      color: #000000;
      border: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <button class="icon-btn" onclick="toggleMenu()">☰</button>
    <button class="icon-btn" onclick="openSettings()">⚙</button>
  </div>

  <!-- Center Fluid Visual -->
  <div class="center-container">
    <div class="orb-canvas-container">
      <canvas id="orbCanvas" width="540" height="540"></canvas>
    </div>
    <div class="status-text" id="status">Tap mic to speak with Cyras</div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <div class="input-box">
      <span class="plus-icon">+</span>
      <input type="text" id="textInput" placeholder="Ask Cyras" onkeydown="handleEnter(event)">
    </div>
    <button class="action-circle-btn" id="micBtn" onclick="toggleListening()">🎤</button>
    <button class="action-circle-btn close" onclick="resetState()">✕</button>
  </div>

  <script>
    const canvas = document.getElementById('orbCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const textInput = document.getElementById('textInput');
    const micBtn = document.getElementById('micBtn');

    let state = 'idle'; // 'idle', 'listening', 'thinking', 'speaking'
    let t = 0;

    // Fluid Liquid Orb Shader / Animation
    function drawOrb() {
      t += (state === 'speaking' ? 0.05 : (state === 'listening' ? 0.03 : 0.015));
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const r = 200 + (state === 'speaking' ? Math.sin(t * 4) * 15 : Math.sin(t) * 5);

      // Create Base Gradient
      const grad = ctx.createLinearGradient(
        cx + Math.cos(t) * 80,
        cy - r + Math.sin(t) * 40,
        cx - Math.sin(t) * 60,
        cy + r
      );

      // Same shades as ChatGPT Voice Orb
      grad.addColorStop(0, '#5a8bff');
      grad.addColorStop(0.35, '#84b4ff');
      grad.addColorStop(0.7, '#d2e4ff');
      grad.addColorStop(1, '#ffffff');

      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Cloud fluid effect layer
      ctx.globalCompositeOperation = 'source-atop';
      const waveGrad = ctx.createRadialGradient(
        cx + Math.sin(t * 1.5) * 60,
        cy + Math.cos(t * 1.5) * 60,
        30,
        cx,
        cy,
        r
      );
      waveGrad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
      waveGrad.addColorStop(0.5, 'rgba(150, 195, 255, 0.4)');
      waveGrad.addColorStop(1, 'rgba(80, 140, 255, 0)');

      ctx.fillStyle = waveGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
      requestAnimationFrame(drawOrb);
    }
    drawOrb();

    // Voice Engine Setup
    let recognition;
    let isListening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'hi-IN';

      recognition.onstart = () => {
        isListening = true;
        state = 'listening';
        micBtn.classList.add('mic-active');
        statusText.innerText = "Cyras listening...";
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        statusText.innerText = `"${text}"`;
        handleAI(text);
      };

      recognition.onerror = () => {
        resetState();
      };

      recognition.onend = () => {
        micBtn.classList.remove('mic-active');
        if (state === 'listening') {
          state = 'idle';
        }
      };
    }

    function toggleListening() {
      if (!recognition) {
        alert("Microphone support is not available.");
        return;
      }
      if (isListening) {
        recognition.stop();
        resetState();
      } else {
        try {
          recognition.start();
        } catch (e) {
          recognition.stop();
        }
      }
    }

    function handleEnter(e) {
      if (e.key === 'Enter' && textInput.value.trim()) {
        const msg = textInput.value.trim();
        textInput.value = '';
        statusText.innerText = `"${msg}"`;
        handleAI(msg);
      }
    }

    // AI Responses Logic
    function handleAI(input) {
      state = 'thinking';
      statusText.innerText = "Thinking...";

      setTimeout(() => {
        let reply = "Main aapki kya madad kar sakta hoon?";
        const low = input.toLowerCase();

        if (low.includes("kaise ho") || low.includes("kese ho")) {
          reply = "Main badhiya hoon! Aap batao, aaj kya chal raha hai?";
        } else if (low.includes("naam") || low.includes("name") || low.includes("who are you")) {
          reply = "Mera naam Cyras hai, aapka AI assistant.";
        } else if (low.includes("time") || low.includes("samay") || low.includes("waqt")) {
          const now = new Date();
          reply = `Abhi time ho raha hai ${now.getHours()} bajkar ${now.getMinutes()} minute.`;
        }

        speakReply(reply);
      }, 600);
    }

    function speakReply(text) {
      state = 'speaking';
      statusText.innerText = text;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'hi-IN';
        utter.rate = 1.05;
        utter.pitch = 1.0;

        utter.onend = () => {
          state = 'idle';
          statusText.innerText = "Tap mic to speak with Cyras";
        };

        window.speechSynthesis.speak(utter);
      }
    }

    function resetState() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      if (recognition && isListening) {
        recognition.stop();
      }
      state = 'idle';
      micBtn.classList.remove('mic-active');
      statusText.innerText = "Tap mic to speak with Cyras";
      isListening = false;
    }

    function toggleMenu() {
      alert("Cyras Menu: v1.0.1 (Ready)");
    }
    function openSettings() {
      alert("Settings: Voice tone set to Indian Natural");
    }
  </script>
</body>
</html>
