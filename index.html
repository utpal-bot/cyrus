<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyras AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .header {
      position: absolute;
      top: 30px;
      font-size: 14px;
      letter-spacing: 3px;
      color: #555555;
      text-transform: uppercase;
    }
    .orb-container {
      position: relative;
      width: 250px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .orb {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #00f2fe, #4facfe, #000814);
      box-shadow: 0 0 60px rgba(0, 242, 254, 0.4), inset 0 0 40px rgba(255, 255, 255, 0.6);
      transition: transform 0.4s ease, box-shadow 0.4s ease, background 0.4s ease;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-10px) scale(1.02); }
    }
    .orb.listening {
      background: radial-gradient(circle at 35% 35%, #00ff87, #60efff, #001f11);
      box-shadow: 0 0 80px rgba(0, 255, 135, 0.7), inset 0 0 40px rgba(255, 255, 255, 0.8);
      animation: pulse-listen 1.5s infinite;
    }
    @keyframes pulse-listen {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    .orb.speaking {
      background: radial-gradient(circle at 35% 35%, #ff0844, #ffb199, #2b0008);
      box-shadow: 0 0 80px rgba(255, 8, 68, 0.7), inset 0 0 40px rgba(255, 255, 255, 0.8);
      animation: pulse-speak 0.8s infinite alternate;
    }
    @keyframes pulse-speak {
      0% { transform: scale(0.98); }
      100% { transform: scale(1.15); }
    }
    .status-text {
      margin-top: 50px;
      font-size: 16px;
      letter-spacing: 1px;
      color: #888888;
      text-align: center;
      max-width: 80%;
      height: 48px;
      line-height: 24px;
    }
    .memory-badge {
      position: absolute;
      bottom: 25px;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #333333;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="header">Cyras Sovereign Core</div>

  <div class="orb-container" id="orbBtn">
    <div class="orb" id="orb"></div>
  </div>

  <div class="status-text" id="status">Tap Orb to Activate Cyras</div>
  <div class="memory-badge" id="memoryStatus">Persistent Memory Online</div>

  <script>
    const orb = document.getElementById('orb');
    const orbBtn = document.getElementById('orbBtn');
    const statusText = document.getElementById('status');

    // Local Sovereign Memory Engine
    const Memory = {
      getHistory: () => JSON.parse(localStorage.getItem('cyras_chat') || '[]'),
      saveChat: (role, text) => {
        const h = Memory.getHistory();
        h.push({ role, text, time: Date.now() });
        if (h.length > 12) h.shift();
        localStorage.setItem('cyras_chat', JSON.stringify(h));
      }
    };

    let recognition = null;
    let isLoopActive = false;
    let isSpeaking = false;

    // Speech Recognition Setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'hi-IN';

      recognition.onstart = () => {
        if (!isSpeaking) {
          orb.className = 'orb listening';
          statusText.innerText = "Cyras listening... boliye Boss";
        }
      };

      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        statusText.innerText = `Boss: "${transcript}"`;
        Memory.saveChat('user', transcript);
        await getCyrasReply(transcript);
      };

      recognition.onerror = (e) => {
        if (isLoopActive && !isSpeaking) {
          setTimeout(startListening, 600);
        }
      };

      recognition.onend = () => {
        if (isLoopActive && !isSpeaking) {
          setTimeout(startListening, 500);
        }
      };
    } else {
      statusText.innerText = "Speech API Not Supported on this WebView";
    }

    function startListening() {
      if (!recognition || isSpeaking) return;
      try {
        recognition.start();
      } catch (err) {
        // Recognition already active
      }
    }

    // Hands-Free TTS Voice Output
    function speakText(text) {
      return new Promise((resolve) => {
        if (!('speechSynthesis' in window)) {
          resolve();
          return;
        }

        window.speechSynthesis.cancel();
        isSpeaking = true;
        orb.className = 'orb speaking';
        statusText.innerText = text;

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'hi-IN';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;

        utterance.onend = () => {
          isSpeaking = false;
          orb.className = 'orb';
          resolve();
        };

        utterance.onerror = () => {
          isSpeaking = false;
          orb.className = 'orb';
          resolve();
        };

        window.speechSynthesis.speak(utterance);
      });
    }

    // AI Brain with Robust Failover
    async function getCyrasReply(prompt) {
      orb.className = 'orb';
      statusText.innerText = "Cyras thinking...";

      const systemPrompt = "You are Cyras, an intelligent, loyal Jarvis-like personal AI assistant. The user is your Boss. Keep responses crisp, confident, natural, and helpful in Hinglish or Hindi. Max 1 to 2 short sentences for clean speech.";

      try {
        const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(systemPrompt + " | User: " + prompt)}?model=openai`);
        if (!res.ok) throw new Error("Brain Server Busy");
        const reply = await res.text();
        await deliverResponse(reply);
      } catch (err) {
        // Offline / Fallback Local Brain Logic
        let fallback = "Ji Boss, main sun raha hoon. Kuch takneeki dikkat aayi par main online hoon.";
        const lower = prompt.toLowerCase();
        if (lower.includes("kaun ho") || lower.includes("who are you")) {
          fallback = "Main Cyras hoon Boss, aapka personal autonomous AI assistant.";
        } else if (lower.includes("kaise ho")) {
          fallback = "Main bilkul badhiya hoon Boss, command dijiye agla kya karna hai.";
        }
        await deliverResponse(fallback);
      }
    }

    async function deliverResponse(text) {
      Memory.saveChat('cyras', text);
      await speakText(text);
      if (isLoopActive) {
        startListening();
      }
    }

    // Main Tap Trigger: Activates Welcome & Hands-Free Duplex Loop
    orbBtn.addEventListener('click', async () => {
      if (!isLoopActive) {
        isLoopActive = true;
        await speakText("Welcome Boss! Cyras is ready.");
        startListening();
      } else {
        // Tap again to pause/reset loop
        isLoopActive = false;
        if (recognition) recognition.stop();
        window.speechSynthesis.cancel();
        isSpeaking = false;
        orb.className = 'orb';
        statusText.innerText = "Cyras paused. Tap Orb to restart.";
      }
    });
  </script>
</body>
</html>
