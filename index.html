<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyras</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      z-index: 10;
    }
    .icon-btn {
      background: none;
      border: none;
      color: #a0a0a0;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
    }
    .icon-btn:active {
      background: #1a1a1a;
      color: #ffffff;
    }

    /* Center Visual Orb */
    .center-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      position: relative;
    }
    .orb-canvas-container {
      position: relative;
      width: 270px;
      height: 270px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 270px;
      height: 270px;
      border-radius: 50%;
      filter: drop-shadow(0 0 50px rgba(115, 165, 255, 0.45));
    }
    .status-text {
      margin-top: 28px;
      color: #777777;
      font-size: 15px;
      letter-spacing: 0.3px;
      text-align: center;
      padding: 0 24px;
      min-height: 22px;
    }

    /* Bottom Input & Controls */
    .bottom-bar {
      display: flex;
      align-items: center;
      padding: 16px 18px 24px;
      gap: 12px;
      background: #000000;
      z-index: 10;
    }
    .input-box {
      flex: 1;
      display: flex;
      align-items: center;
      background-color: #151515;
      border-radius: 35px;
      padding: 11px 18px;
      border: 1px solid #222222;
    }
    .plus-icon {
      color: #888888;
      font-size: 22px;
      font-weight: 300;
      margin-right: 12px;
      cursor: pointer;
    }
    .input-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 16px;
      width: 100%;
    }
    .input-box input::placeholder {
      color: #555555;
    }

    .circle-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #181818;
      border: 1px solid #282828;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .circle-btn:active {
      transform: scale(0.92);
    }

    /* Red Mute Button Style */
    .circle-btn.muted {
      background-color: #e53935 !important;
      border-color: #ff5252 !important;
      color: #ffffff !important;
    }

    .circle-btn.close {
      background: #ffffff;
      color: #000000;
      border: none;
      font-size: 18px;
      font-weight: bold;
    }

    /* Hide any external banners */
    div[class*="tiiny"], a[href*="tiiny.host"], footer {
      display: none !important;
      opacity: 0 !important;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <button class="icon-btn" onclick="toggleMenu()">☰</button>
    <button class="icon-btn" onclick="openSettings()">⚙</button>
  </div>

  <!-- Center Fluid Visual -->
  <div class="center-container">
    <div class="orb-canvas-container">
      <canvas id="orbCanvas" width="540" height="540"></canvas>
    </div>
    <div class="status-text" id="status">Bolo Boss, Cyras sun raha hai...</div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <div class="input-box">
      <span class="plus-icon">+</span>
      <input type="text" id="textInput" placeholder="Cyras se kuch pucho..." onkeydown="handleEnter(event)">
    </div>
    <button class="circle-btn" id="micBtn" onclick="toggleMicMute()">
      <svg id="micIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>
    <button class="circle-btn close" onclick="stopCyras()">✕</button>
  </div>

  <script>
    const ELEVENLABS_API_KEY = "Sk_8dda811aa3e0181054d49ba67dc7eb0dd705e9852dfdc1ab";
    const GEMINI_API_KEY = "AQ.Ab8RN6JSjVsqItm-nZbPUU0tfVPXrlTRrpav5RpG15UZhcp7wA";
    const ELEVEN_VOICE_ID = "pNInz6obpgDQGcFmaJgB"; // Energetic young boy voice

    const canvas = document.getElementById('orbCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const textInput = document.getElementById('textInput');
    const micBtn = document.getElementById('micBtn');

    let state = 'idle'; // 'idle', 'listening', 'thinking', 'speaking'
    let isUserMicMuted = false;
    let t = 0;
    let currentAudio = null;

    // Chat Memory Context
    let chatMemory = [
      {
        role: "user",
        parts: [{ text: "System instructions: You are Cyras, an energetic, witty 15-year-old boy assistant. You talk like an enthusiastic and loyal best friend in natural Hindi / Hinglish. ALWAYS call the user 'Boss' with respect and friendship. Keep spoken answers short, fast, energetic, and to the point like ChatGPT advanced voice mode." }]
      },
      {
        role: "model",
        parts: [{ text: "Haan Boss! Bilkul full energy me baat karenge aur har baat dhyan se sunenge!" }]
      }
    ];

    // Fluid Glowing Orb Animation
    function drawOrb() {
      t += (state === 'speaking' ? 0.05 : (state === 'listening' ? 0.03 : 0.015));
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const r = 205 + (state === 'speaking' ? Math.sin(t * 5) * 16 : Math.sin(t * 1.5) * 6);

      const grad = ctx.createLinearGradient(
        cx + Math.cos(t) * 90,
        cy - r + Math.sin(t) * 45,
        cx - Math.sin(t) * 70,
        cy + r
      );

      grad.addColorStop(0, '#4f83ff');
      grad.addColorStop(0.35, '#82b1ff');
      grad.addColorStop(0.7, '#d6e6ff');
      grad.addColorStop(1, '#ffffff');

      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.globalCompositeOperation = 'source-atop';
      const waveGrad = ctx.createRadialGradient(
        cx + Math.sin(t * 1.6) * 70,
        cy + Math.cos(t * 1.6) * 70,
        25,
        cx,
        cy,
        r
      );
      waveGrad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
      waveGrad.addColorStop(0.45, 'rgba(150, 195, 255, 0.35)');
      waveGrad.addColorStop(1, 'rgba(70, 130, 255, 0)');

      ctx.fillStyle = waveGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
      requestAnimationFrame(drawOrb);
    }
    drawOrb();

    // Speech Recognition Setup
    let recognition;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'hi-IN';

      recognition.onstart = () => {
        if (!isUserMicMuted && state !== 'speaking') {
          state = 'listening';
          statusText.innerText = "Cyras sun raha hai, Boss...";
        }
      };

      recognition.onresult = (event) => {
        if (isUserMicMuted) return; // Agar mute hai to awaz andar nahi jayegi
        const query = event.results[0][0].transcript;
        statusText.innerText = `"${query}"`;
        processBrain(query);
      };

      recognition.onerror = () => {
        if (!isUserMicMuted && state !== 'speaking') {
          setTimeout(startListening, 600);
        }
      };

      recognition.onend = () => {
        if (!isUserMicMuted && state !== 'speaking' && state !== 'thinking') {
          setTimeout(startListening, 500);
        }
      };
    }

    function startListening() {
      if (isUserMicMuted || state === 'speaking' || state === 'thinking') return;
      try {
        recognition.start();
      } catch (e) {}
    }

    // Sirf User ka Mic On/Off karne ka logic
    function toggleMicMute() {
      if (!isUserMicMuted) {
        // Mic Band (RED Button) - Cyras will NOT hear user
        isUserMicMuted = true;
        micBtn.classList.add('muted');
        micBtn.innerHTML = `
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
            <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        `;
        if (recognition) recognition.stop();
        if (state === 'listening') state = 'idle';
        if (state !== 'speaking') {
          statusText.innerText = "Aapka Mic Mute hai (Cyras nahi sunega)";
        }
        // Notice: currentAudio ko pause NAHI kiya, taaki agar Cyras bol raha ho to wo chalta rahe!
      } else {
        // Mic Wapas Chalu (Normal Button)
        isUserMicMuted = false;
        micBtn.classList.remove('muted');
        micBtn.innerHTML = `
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        `;
        if (state !== 'speaking') {
          statusText.innerText = "Cyras sun raha hai, Boss...";
          startListening();
        }
      }
    }

    function handleEnter(e) {
      if (e.key === 'Enter' && textInput.value.trim()) {
        const msg = textInput.value.trim();
        textInput.value = '';
        statusText.innerText = `"${msg}"`;
        processBrain(msg);
      }
    }

    // Brain Process (Gemini Flash)
    async function processBrain(userPrompt) {
      state = 'thinking';
      statusText.innerText = "Soch raha hoon, Boss...";
      if (recognition) recognition.stop();

      chatMemory.push({
        role: "user",
        parts: [{ text: userPrompt }]
      });

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: chatMemory })
        });

        const data = await response.json();
        let reply = "Haan Boss! Bilkul ready hoon.";
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          reply = data.candidates[0].content.parts[0].text;
        }

        chatMemory.push({
          role: "model",
          parts: [{ text: reply }]
        });

        playHumanVoice(reply);
      } catch (err) {
        playHumanVoice("Network me thoda issue lag raha hai Boss, dobara bolna!");
      }
    }

    // Voice Engine (ElevenLabs Human Boy)
    async function playHumanVoice(text) {
      state = 'speaking';
      statusText.innerText = text;

      try {
        const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${ELEVEN_VOICE_ID}`, {
          method: 'POST',
          headers: {
            'xi-api-key': ELEVENLABS_API_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            text: text,
            model_id: "eleven_multilingual_v2",
            voice_settings: {
              stability: 0.45,
              similarity_boost: 0.85,
              style: 0.35,
              use_speaker_boost: true
            }
          })
        });

        const blob = await response.blob();
        const audioUrl = URL.createObjectURL(blob);
        if (currentAudio) currentAudio.pause();
        currentAudio = new Audio(audioUrl);

        currentAudio.onended = () => {
          state = 'idle';
          if (!isUserMicMuted) {
            statusText.innerText = "Bolo Boss, sun raha hoon...";
            startListening();
          } else {
            statusText.innerText = "Aapka Mic Mute hai";
          }
        };

        currentAudio.play();
      } catch (err) {
        // Fallback responsive TTS if network slows down
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'hi-IN';
        utter.pitch = 1.25;
        utter.rate = 1.1;
        utter.onend = () => {
          state = 'idle';
          if (!isUserMicMuted) startListening();
        };
        window.speechSynthesis.speak(utter);
      }
    }

    // Stop Everything Button (✕)
    function stopCyras() {
      if (currentAudio) currentAudio.pause();
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (recognition) recognition.stop();
      state = 'idle';
      statusText.innerText = "Rok diya Boss. Jab baat karni ho mic on kar lena.";
    }

    // Auto start on launch
    window.addEventListener('load', () => {
      setTimeout(() => {
        if (!isUserMicMuted) startListening();
      }, 1000);
    });

    function toggleMenu() {
      alert("Cyras Menu: Smart Memory + 15yo Energetic Boy Voice Active.");
    }
    function openSettings() {
      alert("Settings: Voice model set to ElevenLabs Human Boy.");
    }
  </script>
</body>
</html>
