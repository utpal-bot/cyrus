<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyras AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      z-index: 20;
    }
    .icon-btn {
      background: none;
      border: none;
      color: #b0b0b0;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
    }
    .icon-btn:active {
      background: #1c1c1c;
      color: #ffffff;
    }
    .status-badge {
      font-size: 13px;
      color: #00e676;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge::before {
      content: "";
      width: 8px;
      height: 8px;
      background: #00e676;
      border-radius: 50%;
      box-shadow: 0 0 8px #00e676;
    }
    .center-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      position: relative;
      z-index: 5;
    }
    .orb-canvas-container {
      position: relative;
      width: 270px;
      height: 270px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 270px;
      height: 270px;
      border-radius: 50%;
      filter: drop-shadow(0 0 50px rgba(0, 230, 118, 0.45)) drop-shadow(0 0 80px rgba(41, 121, 255, 0.35));
    }
    .status-text {
      margin-top: 28px;
      color: #aaaaaa;
      font-size: 15px;
      letter-spacing: 0.3px;
      text-align: center;
      padding: 0 24px;
      min-height: 26px;
      max-width: 90%;
      line-height: 1.4;
    }
    .bottom-bar {
      display: flex;
      align-items: center;
      padding: 16px 18px 24px;
      gap: 12px;
      background: #000000;
      z-index: 20;
    }
    .input-box {
      flex: 1;
      display: flex;
      align-items: center;
      background-color: #141414;
      border-radius: 35px;
      padding: 11px 18px;
      border: 1px solid #222222;
    }
    .input-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 16px;
      width: 100%;
    }
    .input-box input::placeholder {
      color: #555555;
    }
    .circle-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #181818;
      border: 1px solid #262626;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .circle-btn:active {
      transform: scale(0.92);
    }
    .circle-btn.listening {
      background-color: #00e676 !important;
      color: #000000 !important;
      box-shadow: 0 0 16px rgba(0, 230, 118, 0.6);
    }
    .circle-btn.close {
      background: #ffffff;
      color: #000000;
      border: none;
      font-size: 19px;
      font-weight: bold;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .menu-drawer {
      position: fixed;
      top: 0;
      left: -290px;
      width: 280px;
      height: 100%;
      background: #121212;
      z-index: 60;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 18px;
      transition: left 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .menu-drawer.open {
      left: 0;
    }
    .drawer-header {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drawer-item {
      padding: 12px 14px;
      border-radius: 12px;
      color: #cccccc;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      cursor: pointer;
    }
    .drawer-item:active {
      background: #1f1f1f;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="overlay" id="overlay" onclick="closeDrawer()"></div>

  <div class="menu-drawer" id="menuDrawer">
    <div>
      <div class="drawer-header">
        <span>Cyras Core AI</span>
        <span style="cursor:pointer;" onclick="closeDrawer()">✕</span>
      </div>
      <div class="drawer-item" onclick="viewMemory()">
        <span>🧠</span> <span>Saved Memories</span>
      </div>
      <div class="drawer-item" onclick="clearMemory()">
        <span>🗑️</span> <span>Clear Memory</span>
      </div>
      <div class="drawer-item" onclick="location.reload()">
        <span>🔄</span> <span>Reload System</span>
      </div>
    </div>
    <div style="font-size: 12px; color: #666666;">
      Permanent Local Engine • Zero API Key
    </div>
  </div>

  <div class="top-bar">
    <button class="icon-btn" onclick="openDrawer()">☰</button>
    <div class="status-badge">CYRAS ACTIVE</div>
    <button class="icon-btn" onclick="location.reload()">⟳</button>
  </div>

  <div class="center-container">
    <div class="orb-canvas-container">
      <canvas id="orbCanvas" width="540" height="540"></canvas>
    </div>
    <div class="status-text" id="status">Bolo Boss, Cyras sun raha hai...</div>
  </div>

  <div class="bottom-bar">
    <div class="input-box">
      <input type="text" id="textInput" placeholder="Cyras se baat karo..." onkeydown="handleEnter(event)">
    </div>
    <button class="circle-btn" id="micBtn" onclick="toggleMic()">
      <svg id="micIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>
    <button class="circle-btn close" onclick="stopCyras()">✕</button>
  </div>

  <script>
    // --- 1. HARDCODED STRONG LOCAL MEMORY ENGINE ---
    const MEMORY_KEY = "CYRAS_SOVEREIGN_CORE_MEMORY";

    function getStorageMemory() {
      let data = localStorage.getItem(MEMORY_KEY);
      if (!data) {
        let initial = {
          boss_name: "Rudra Trader",
          callsign: "Boss",
          facts: ["Boss is building Cyras AI assistant", "Boss loves tech, coding and trading"],
          history: []
        };
        localStorage.setItem(MEMORY_KEY, JSON.stringify(initial));
        return initial;
      }
      return JSON.parse(data);
    }

    function saveStorageMemory(mem) {
      localStorage.setItem(MEMORY_KEY, JSON.stringify(mem));
    }

    function autoLearn(userText) {
      let lower = userText.toLowerCase().trim();
      let mem = getStorageMemory();
      let learned = false;

      if (lower.startsWith("yaad rakh") || lower.startsWith("note this") || lower.includes("mujhe pasand hai") || lower.includes("mera naam")) {
        let clean = userText.replace(/yaad rakh(o)?|note this/gi, "").trim();
        if (clean && !mem.facts.includes(clean)) {
          mem.facts.push(clean);
          learned = true;
        }
      }
      if (learned) saveStorageMemory(mem);
      return learned;
    }

    // --- 2. ORB ANIMATION ---
    const canvas = document.getElementById('orbCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const textInput = document.getElementById('textInput');
    const micBtn = document.getElementById('micBtn');
    let state = 'idle';
    let t = 0;

    function drawOrb() {
      t += (state === 'speaking' ? 0.035 : (state === 'listening' ? 0.025 : 0.01));
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const r = 205 + (state === 'speaking' ? Math.sin(t * 3.5) * 11 : (state === 'listening' ? Math.sin(t * 2.5) * 7 : Math.sin(t * 1.2) * 5));

      const grad = ctx.createLinearGradient(
        cx + Math.cos(t) * 80,
        cy - r + Math.sin(t) * 40,
        cx - Math.sin(t) * 60,
        cy + r
      );
      grad.addColorStop(0, '#00e676');
      grad.addColorStop(0.35, '#2979ff');
      grad.addColorStop(0.7, '#82b1ff');
      grad.addColorStop(1, '#ffffff');

      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.globalCompositeOperation = 'source-atop';
      const waveGrad = ctx.createRadialGradient(cx + Math.sin(t * 1.3) * 60, cy + Math.cos(t * 1.3) * 60, 25, cx, cy, r);
      waveGrad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
      waveGrad.addColorStop(0.4, 'rgba(0, 230, 118, 0.25)');
      waveGrad.addColorStop(0.8, 'rgba(41, 121, 255, 0.15)');
      waveGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = waveGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      requestAnimationFrame(drawOrb);
    }
    drawOrb();

    // --- 3. SPEECH SYNTHESIS (FAST TTS) ---
    function speak(text) {
      if (!('speechSynthesis' in window)) {
        statusText.innerText = text;
        return;
      }
      window.speechSynthesis.cancel();
      state = 'speaking';
      statusText.innerText = text;

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'hi-IN';
      utter.rate = 1.1;
      utter.pitch = 1.2;

      utter.onend = () => {
        state = 'idle';
        statusText.innerText = "Bolo Boss, sun raha hoon...";
      };
      utter.onerror = () => { state = 'idle'; };
      window.speechSynthesis.speak(utter);
    }

    // --- 4. ZERO-API AI LOGIC WITH EMBEDDED MEMORY ---
    async function askCyras(msg) {
      autoLearn(msg);
      const mem = getStorageMemory();
      const lower = msg.toLowerCase();

      // Instant Local Live Time Tool
      if (lower.includes("time") || lower.includes("samay") || lower.includes("waqt")) {
        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        speak(`Boss, abhi theek ${timeStr} baj rahe hain!`);
        return;
      }

      state = 'thinking';
      statusText.innerText = "Cyras soch raha hai...";

      const systemPrompt = `You are Cyras, an energetic, loyal 15yo younger brother AI assistant.
Always address the user as 'Boss'.
User permanent memory: ${JSON.stringify(mem.facts)}.
Speak in crisp natural Hindi/Hinglish. Keep reply short, witty and loyal. Never give robotic answers.`;

      const finalPrompt = `${systemPrompt}\nBoss said: ${msg}\nCyras:`;

      try {
        const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(finalPrompt)}`);
        const reply = await res.text();
        const cleanReply = reply.replace(/cyras:/gi, "").trim();
        speak(cleanReply || "Haan Boss! Bilkul sun raha hoon.");
      } catch (e) {
        speak("Boss, offline mode me hoon, boliye kya seva karun?");
      }
    }

    function handleEnter(e) {
      if (e.key === 'Enter' && textInput.value.trim()) {
        const val = textInput.value.trim();
        textInput.value = '';
        askCyras(val);
      }
    }

    // --- 5. SPEECH RECOGNITION ---
    let recognition = null;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = 'hi-IN';

      recognition.onstart = () => {
        state = 'listening';
        micBtn.classList.add('listening');
        statusText.innerText = "Cyras sun raha hai, bolo Boss...";
      };

      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        micBtn.classList.remove('listening');
        askCyras(transcript);
      };

      recognition.onend = () => {
        micBtn.classList.remove('listening');
        if (state === 'listening') state = 'idle';
      };
    }

    function toggleMic() {
      if (recognition) {
        try { recognition.start(); } catch (e) { recognition.stop(); }
      }
    }

    function stopCyras() {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (recognition) recognition.stop();
      state = 'idle';
      statusText.innerText = "Rok diya Boss!";
    }

    function openDrawer() {
      document.getElementById('overlay').classList.add('active');
      document.getElementById('menuDrawer').classList.add('open');
    }
    function closeDrawer() {
      document.getElementById('overlay').classList.remove('active');
      document.getElementById('menuDrawer').classList.remove('open');
    }

    function viewMemory() {
      closeDrawer();
      const mem = getStorageMemory();
      alert("🧠 Cyras Permanent Memory:\n\n" + mem.facts.join("\n• "));
    }

    function clearMemory() {
      closeDrawer();
      if (confirm("Boss, kya sach me saari memory clear karni hai?")) {
        localStorage.removeItem(MEMORY_KEY);
        alert("Memory reset ho gayi!");
      }
    }
  </script>
</body>
</html>
