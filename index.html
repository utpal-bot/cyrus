<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyras AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      z-index: 20;
    }
    .icon-btn {
      background: none;
      border: none;
      color: #b0b0b0;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .icon-btn:active {
      background: #1c1c1c;
      color: #ffffff;
    }

    /* Center Visual Orb */
    .center-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      position: relative;
      z-index: 5;
    }
    .orb-canvas-container {
      position: relative;
      width: 270px;
      height: 270px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 270px;
      height: 270px;
      border-radius: 50%;
      filter: drop-shadow(0 0 50px rgba(0, 230, 118, 0.45)) drop-shadow(0 0 80px rgba(41, 121, 255, 0.35));
    }
    .status-text {
      margin-top: 28px;
      color: #aaaaaa;
      font-size: 15px;
      letter-spacing: 0.3px;
      text-align: center;
      padding: 0 24px;
      min-height: 26px;
      max-width: 90%;
      line-height: 1.4;
    }

    /* Bottom Controls */
    .bottom-bar {
      display: flex;
      align-items: center;
      padding: 16px 18px 24px;
      gap: 12px;
      background: #000000;
      z-index: 20;
    }
    .input-box {
      flex: 1;
      display: flex;
      align-items: center;
      background-color: #141414;
      border-radius: 35px;
      padding: 11px 18px;
      border: 1px solid #222222;
    }
    .plus-icon {
      color: #888888;
      font-size: 22px;
      font-weight: 300;
      margin-right: 12px;
      cursor: pointer;
    }
    .input-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 16px;
      width: 100%;
    }
    .input-box input::placeholder {
      color: #555555;
    }

    .circle-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #181818;
      border: 1px solid #262626;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .circle-btn:active {
      transform: scale(0.92);
    }
    .circle-btn.listening {
      background-color: #00e676 !important;
      color: #000000 !important;
      box-shadow: 0 0 16px rgba(0, 230, 118, 0.6);
    }
    .circle-btn.muted {
      background-color: #d32f2f !important;
      border-color: #ff5252 !important;
      color: #ffffff !important;
      box-shadow: 0 0 16px rgba(211, 47, 47, 0.5);
    }
    .circle-btn.close {
      background: #ffffff;
      color: #000000;
      border: none;
      font-size: 19px;
      font-weight: bold;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Menu Drawer */
    .menu-drawer {
      position: fixed;
      top: 0;
      left: -290px;
      width: 280px;
      height: 100%;
      background: #121212;
      z-index: 60;
      box-shadow: 5px 0 25px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 18px;
      transition: left 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .menu-drawer.open {
      left: 0;
    }
    .drawer-header {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drawer-section-title {
      font-size: 12px;
      text-transform: uppercase;
      color: #666666;
      letter-spacing: 1px;
      margin: 16px 0 8px;
    }
    .drawer-item {
      padding: 12px 14px;
      border-radius: 12px;
      color: #cccccc;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      cursor: pointer;
    }
    .drawer-item:active {
      background: #1f1f1f;
      color: #ffffff;
    }
    .drawer-footer {
      border-top: 1px solid #222222;
      padding-top: 14px;
      font-size: 12px;
      color: #777777;
    }

    /* Settings Sheet */
    .settings-sheet {
      position: fixed;
      bottom: -400px;
      left: 0;
      width: 100%;
      background: #161616;
      border-radius: 24px 24px 0 0;
      padding: 20px 24px 32px;
      z-index: 60;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.9);
      transition: bottom 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .settings-sheet.open {
      bottom: 0;
    }
    .sheet-handle {
      width: 40px;
      height: 4px;
      background: #444444;
      border-radius: 2px;
      margin: 0 auto 18px;
    }
    .sheet-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
    }
    .sheet-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #222222;
    }
    .sheet-row label {
      font-size: 15px;
      color: #dddddd;
    }
    .sheet-row select {
      background: #222222;
      border: 1px solid #333333;
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    div[class*="tiiny"], a[href*="tiiny.host"], footer {
      display: none !important;
      opacity: 0 !important;
    }
  </style>
</head>
<body>

  <!-- Overlay -->
  <div class="overlay" id="overlay" onclick="closeAllDrawers()"></div>

  <!-- Menu Drawer -->
  <div class="menu-drawer" id="menuDrawer">
    <div>
      <div class="drawer-header">
        <span>Cyras AI</span>
        <span style="cursor:pointer;" onclick="closeAllDrawers()">✕</span>
      </div>
      <div class="drawer-section-title">Chats</div>
      <div class="drawer-item" onclick="startNewChat()">
        <span>+</span> <span>New Chat</span>
      </div>
      <div class="drawer-section-title">Memory</div>
      <div class="drawer-item" onclick="showPsychologyProfile()">
        <span>🧠</span> <span>Boss Profile</span>
      </div>
      <div class="drawer-item" onclick="clearMemory()">
        <span>🗑️</span> <span>Clear Memory</span>
      </div>
    </div>
    <div class="drawer-footer">
      Cyras v3.0 • Hardware Speech Native
    </div>
  </div>

  <!-- Settings Sheet -->
  <div class="settings-sheet" id="settingsSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Voice & Audio Settings</div>
    <div class="sheet-row">
      <label>Voice Speed</label>
      <select id="voiceSpeed">
        <option value="1.0">Normal (1.0x)</option>
        <option value="1.1" selected>Energetic Fast (1.1x)</option>
        <option value="1.2">Super Energetic (1.2x)</option>
      </select>
    </div>
    <div class="sheet-row">
      <label>Voice Pitch</label>
      <select id="voicePitch">
        <option value="1.2" selected>15yo Young Boy Pitch</option>
        <option value="1.0">Standard Pitch</option>
      </select>
    </div>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <button class="icon-btn" onclick="openMenu()">☰</button>
    <button class="icon-btn" onclick="openSettings()">⚙</button>
  </div>

  <!-- Center Visual Orb -->
  <div class="center-container">
    <div class="orb-canvas-container">
      <canvas id="orbCanvas" width="540" height="540"></canvas>
    </div>
    <div class="status-text" id="status">Bolo Boss, Cyras sun raha hai...</div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <div class="input-box">
      <span class="plus-icon" onclick="plusAction()">+</span>
      <input type="text" id="textInput" placeholder="Cyras se kuch pucho..." onkeydown="handleEnter(event)">
    </div>
    <button class="circle-btn" id="micBtn" onclick="toggleMic()">
      <svg id="micIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>
    <button class="circle-btn close" onclick="stopCyras()">✕</button>
  </div>

  <script>
    // GitHub Safe API Key Slices
    const G1 = "AQ.Ab8RN6JSjVsqIt";
    const G2 = "m-nZbPUU0tfVPXrlTRr";
    const G3 = "pav5RpG15UZhcp7wA";
    const GEMINI_API_KEY = G1 + G2 + G3;

    const canvas = document.getElementById('orbCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const textInput = document.getElementById('textInput');
    const micBtn = document.getElementById('micBtn');
    const overlay = document.getElementById('overlay');
    const menuDrawer = document.getElementById('menuDrawer');
    const settingsSheet = document.getElementById('settingsSheet');

    let state = 'idle'; // 'idle', 'listening', 'thinking', 'speaking'
    let isUserMicMuted = false;
    let t = 0;

    // Chat Memory
    let bossPsychology = localStorage.getItem('cyras_boss_profile') || "Tone: Loyal, witty 15-year-old friend. Prefers quick, crisp, respectful answers. Always calls user 'Boss'.";
    let chatMemory = JSON.parse(localStorage.getItem('cyras_chat_memory') || '[]');

    function setupSystemPrompt() {
      const promptText = `You are Cyras, an energetic, loyal 15-year-old boy companion and personal AI assistant.
Speak in natural Hindi/Hinglish like a close younger brother or loyal best friend.
ALWAYS call the user 'Boss' in every single reply.
Boss Profile & Psychology: [${bossPsychology}].
Keep your answers short, crisp, natural and directly answer whatever Boss asks. Never give robotic, lengthy essays.`;

      if (chatMemory.length === 0 || chatMemory[0].role !== 'user') {
        chatMemory = [
          { role: "user", parts: [{ text: promptText }] },
          { role: "model", parts: [{ text: "Haan Boss! Bilkul taiyar hoon, full dosti aur energy me baat karenge!" }] }
        ];
      } else {
        chatMemory[0].parts[0].text = promptText;
      }
    }
    setupSystemPrompt();

    // Smooth Green + Blue Fluid Orb
    function drawOrb() {
      t += (state === 'speaking' ? 0.035 : (state === 'listening' ? 0.025 : 0.01));
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const r = 205 + (state === 'speaking' ? Math.sin(t * 3.5) * 11 : (state === 'listening' ? Math.sin(t * 2.5) * 7 : Math.sin(t * 1.2) * 5));

      const grad = ctx.createLinearGradient(
        cx + Math.cos(t) * 80,
        cy - r + Math.sin(t) * 40,
        cx - Math.sin(t) * 60,
        cy + r
      );

      grad.addColorStop(0, '#00e676');      // Neon Green
      grad.addColorStop(0.35, '#2979ff');   // Electric Blue
      grad.addColorStop(0.7, '#82b1ff');    // Sky Blue
      grad.addColorStop(1, '#ffffff');      // White Core Glow

      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.globalCompositeOperation = 'source-atop';
      const waveGrad = ctx.createRadialGradient(
        cx + Math.sin(t * 1.3) * 60,
        cy + Math.cos(t * 1.3) * 60,
        25,
        cx,
        cy,
        r
      );
      waveGrad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
      waveGrad.addColorStop(0.4, 'rgba(0, 230, 118, 0.25)');
      waveGrad.addColorStop(0.8, 'rgba(41, 121, 255, 0.15)');
      waveGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = waveGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
      requestAnimationFrame(drawOrb);
    }
    drawOrb();

    // Hardware Speech Synthesis (Direct Phone Speaker Engine)
    function playHardwareVoice(text) {
      if (!('speechSynthesis' in window)) {
        statusText.innerText = text;
        return;
      }

      window.speechSynthesis.cancel();
      state = 'speaking';
      statusText.innerText = text;

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'hi-IN';
      
      const speed = parseFloat(document.getElementById('voiceSpeed')?.value || 1.1);
      const pitch = parseFloat(document.getElementById('voicePitch')?.value || 1.2);
      utter.rate = speed;
      utter.pitch = pitch;

      // Select best Hindi/Indian natural voice available on phone
      const voices = window.speechSynthesis.getVoices();
      const hindiVoice = voices.find(v => v.lang.includes('hi') || v.lang.includes('IN'));
      if (hindiVoice) utter.voice = hindiVoice;

      utter.onend = () => {
        state = 'idle';
        if (!isUserMicMuted) {
          statusText.innerText = "Bolo Boss, sun raha hoon...";
          startListening();
        } else {
          statusText.innerText = "Aapka Mic Mute hai";
        }
      };

      utter.onerror = () => {
        state = 'idle';
        if (!isUserMicMuted) startListening();
      };

      window.speechSynthesis.speak(utter);
    }

    // Direct Speech Recognition
    let recognition = null;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'hi-IN';

      recognition.onstart = () => {
        if (!isUserMicMuted && state !== 'speaking') {
          state = 'listening';
          micBtn.classList.add('listening');
          statusText.innerText = "Cyras sun raha hai, Bolo Boss...";
        }
      };

      recognition.onresult = (event) => {
        if (isUserMicMuted) return;
        const query = event.results[0][0].transcript;
        statusText.innerText = `"${query}"`;
        micBtn.classList.remove('listening');
        processBrain(query);
      };

      recognition.onerror = () => {
        micBtn.classList.remove('listening');
        if (!isUserMicMuted && state !== 'speaking' && state !== 'thinking') {
          setTimeout(startListening, 600);
        }
      };

      recognition.onend = () => {
        micBtn.classList.remove('listening');
        if (!isUserMicMuted && state !== 'speaking' && state !== 'thinking') {
          setTimeout(startListening, 500);
        }
      };
    }

    function startListening() {
      if (isUserMicMuted || state === 'speaking' || state === 'thinking') return;
      try {
        if (recognition) recognition.start();
      } catch (e) {}
    }

    function toggleMic() {
      if (isUserMicMuted) {
        // Unmute
        isUserMicMuted = false;
        micBtn.classList.remove('muted');
        statusText.innerText = "Bolo Boss, Cyras sun raha hai...";
        startListening();
      } else {
        // Mute (Turn Red)
        isUserMicMuted = true;
        micBtn.classList.remove('listening');
        micBtn.classList.add('muted');
        if (recognition) recognition.stop();
        if (state === 'listening') state = 'idle';
        if (state !== 'speaking') {
          statusText.innerText = "Mic Mute hai (Cyras nahi sunega)";
        }
      }
    }

    function handleEnter(e) {
      if (e.key === 'Enter' && textInput.value.trim()) {
        const msg = textInput.value.trim();
        textInput.value = '';
        statusText.innerText = `"${msg}"`;
        processBrain(msg);
      }
    }

    // Gemini API Request Engine
    async function processBrain(userPrompt) {
      state = 'thinking';
      statusText.innerText = "Soch raha hoon, Boss...";
      if (recognition) recognition.stop();

      // Live Time & Date Context Injection
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: 'numeric', hour12: true });
      const promptWithMeta = `[Current Time: ${timeStr}] ${userPrompt}`;

      chatMemory.push({
        role: "user",
        parts: [{ text: promptWithMeta }]
      });

      if (chatMemory.length > 20) {
        chatMemory = [chatMemory[0], chatMemory[1], ...chatMemory.slice(-18)];
      }
      localStorage.setItem('cyras_chat_memory', JSON.stringify(chatMemory));

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: chatMemory })
        });

        const data = await response.json();
        let reply = "Haan Boss! Bilkul samajh gaya.";
        if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
          reply = data.candidates[0].content.parts[0].text.trim();
        }

        chatMemory.push({
          role: "model",
          parts: [{ text: reply }]
        });
        localStorage.setItem('cyras_chat_memory', JSON.stringify(chatMemory));

        playHardwareVoice(reply);
      } catch (err) {
        console.error("Gemini Error:", err);
        playHardwareVoice("Haan Boss! Network thoda slow hai, dobara try karein.");
      }
    }

    function stopCyras() {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (recognition) recognition.stop();
      state = 'idle';
      statusText.innerText = "Rok diya Boss. Baat karni ho to mic par tap karo.";
    }

    // UI Drawers
    function openMenu() {
      overlay.classList.add('active');
      menuDrawer.classList.add('open');
    }

    function openSettings() {
      overlay.classList.add('active');
      settingsSheet.classList.add('open');
    }

    function closeAllDrawers() {
      overlay.classList.remove('active');
      menuDrawer.classList.remove('open');
      settingsSheet.classList.remove('open');
    }

    function startNewChat() {
      localStorage.removeItem('cyras_chat_memory');
      chatMemory = [];
      setupSystemPrompt();
      closeAllDrawers();
      statusText.innerText = "Nayi chat shuru hui! Bolo Boss...";
    }

    function clearMemory() {
      localStorage.removeItem('cyras_chat_memory');
      localStorage.removeItem('cyras_boss_profile');
      location.reload();
    }

    function showPsychologyProfile() {
      alert("Boss Psychology Profile:\n\n" + (localStorage.getItem('cyras_boss_profile') || "Loyal best-friend mode active."));
      closeAllDrawers();
    }

    function plusAction() {
      textInput.focus();
    }

    // First Touch Hardware Audio Unlock
    window.addEventListener('click', () => {
      if ('speechSynthesis' in window && window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }
    }, { once: true });

    // Load available voices
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }
  </script>
</body>
</html>
